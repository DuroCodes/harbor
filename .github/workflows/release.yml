name: release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      attach_tag:
        description: Optional GitHub release tag to attach the apk to (e.g. v0.2.1)
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

# Local EAS Android build on the runner (expobuilder.app) — no Expo cloud queue.
# release-please still cuts the github release; this job attaches harbor-android.apk.

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['apps/mobile--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  android:
    name: android apk
    needs: [release-please]
    if: |
      always() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.release-please.result == 'skipped') ||
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: bun

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build sideload apk
        env:
          EAS_NO_VCS: 1
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          eas build \
            --platform android \
            --profile sideload \
            --local \
            --non-interactive \
            --output="${GITHUB_WORKSPACE}/artifacts/harbor-android.apk"

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbor-android
          path: artifacts/harbor-android.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: |
          needs.release-please.outputs.release_created == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.attach_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.attach_tag }}
        run: |
          set -euo pipefail
          apk="${GITHUB_WORKSPACE}/artifacts/harbor-android.apk"
          if [ ! -f "$apk" ]; then
            echo "missing $apk"
            exit 1
          fi
          if [ -z "${TAG}" ]; then
            echo "no release tag to attach to"
            exit 1
          fi
          gh release upload "$TAG" "$apk" --clobber
